  stretch_controller:
    type: FollowJointTrajectory
    joints:
      - joint_lift
      - joint_arm_l3
      - joint_arm_l2
      - joint_arm_l1
      - joint_arm_l0
      - joint_wrist_yaw
      - joint_wrist_pitch
      - joint_wrist_roll
      - joint_left_wheel
      - joint_right_wheel
    action_ns: follow_joint_trajectory
    default: true